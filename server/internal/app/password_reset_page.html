<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{{.Title}} — NeoChat</title>
  <style nonce="{{.Nonce}}">
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef1f7;background:#101b30;color-scheme:dark;--muted:#b3c2d9;--line:#ffffff16;--card:#192943e6;--accent:#98b9ff;--button:#4169cf;--icon:#263f68}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:40px 20px;background:radial-gradient(ellipse at 85% 0%,#234d944d,transparent 65%),radial-gradient(ellipse at 0% 100%,#184c5e44,transparent 60%)}
    main{width:100%;max-width:480px}header{display:flex;align-items:center;gap:12px;margin:0 8px 28px;font-size:24px;font-weight:650;letter-spacing:-.6px}header img{width:40px;height:40px;object-fit:contain}
    article{padding:36px;border:1px solid var(--line);border-radius:28px;background:var(--card);box-shadow:0 24px 80px #050d1c30;overflow-wrap:anywhere}
    .symbol{width:64px;height:64px;display:grid;place-items:center;background:var(--icon);border-radius:21px;color:var(--accent);margin-bottom:28px}.symbol svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    h1{font-size:32px;line-height:1.16;letter-spacing:-.8px;font-weight:650;margin:0 0 16px}p{font-size:16px;line-height:1.6;margin:0;color:var(--muted)}.address{margin:22px 0 0;padding:14px 16px;border:1px solid var(--line);border-radius:12px;color:inherit;font-weight:500;font-size:15px}
    .code{margin:22px 0 0;padding:16px;border:1px solid var(--line);border-radius:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;line-height:1.45;word-break:break-all;user-select:all;color:inherit}
    button{font:inherit;font-weight:600;color:#fff;background:var(--button);border:0;border-radius:14px;padding:16px 20px;min-height:54px;width:100%;cursor:pointer;margin-top:20px}button:hover{background:#527ce3}button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.copied{min-height:24px;margin-top:8px;font-size:14px}
    .hint{font-size:13px;line-height:1.55;margin-top:20px}footer{margin:24px 8px 0;font-size:12px;line-height:1.5;color:var(--muted)}
    @media(max-width:400px){body{padding:28px 16px}article{padding:28px 24px;border-radius:24px}h1{font-size:29px}header{margin-bottom:24px}}
    @media(prefers-color-scheme:light){:root{color:#1c2638;background:#e9eff9;color-scheme:light;--muted:#53617a;--line:#1a36551a;--card:#ffffffed;--accent:#2456b8;--button:#315dcf;--icon:#e8efff}body{background:radial-gradient(ellipse at 100% 0%,#bcd6ff66,transparent 70%)}article{box-shadow:0 24px 80px #2746790d}}
  </style>
</head>
<body>
<main>
  <header><img src="{{.Logo}}" alt="" width="40" height="40">NeoChat</header>
  <article aria-labelledby="title">
    <div class="symbol" aria-hidden="true">
      <svg viewBox="0 0 32 32">{{if .Token}}<rect x="6" y="14" width="20" height="12" rx="3"/><path d="M10 14V11a6 6 0 0 1 12 0v3"/>{{else}}<circle cx="16" cy="16" r="12"/><path d="M16 9v8m0 5h.01"/>{{end}}</svg>
    </div>
    <h1 id="title">{{.Title}}</h1>
    <p>{{.Message}}</p>
    {{if .Address}}<p class="address">{{.Address}}</p>{{end}}
    {{if .Token}}
    <p class="code" id="reset-code">{{.Token}}</p>
    <button type="button" id="copy-code">Скопировать код восстановления</button>
    <p class="copied" id="copy-status" role="status"></p>
    <p class="hint">Код одноразовый, действует 30 минут. Не передавайте его другим людям. Сброс меняет пароль входа; ключи и история на ваших устройствах сохраняются.</p>
    <script nonce="{{.Nonce}}">
      document.getElementById('copy-code').addEventListener('click',async()=>{
        const code=document.getElementById('reset-code');
        try{await navigator.clipboard.writeText(code.textContent);document.getElementById('copy-status').textContent='Код скопирован. Вернитесь в NeoChat.';}
        catch{const range=document.createRange();range.selectNodeContents(code);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);document.getElementById('copy-status').textContent='Код выделен — скопируйте его вручную.';}
      });
    </script>
    {{end}}
  </article>
  <footer>Сброс пароля · NeoChat</footer>
</main>
</body>
</html>
