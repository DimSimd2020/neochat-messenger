<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="198 222 600 600" fill="none" role="img" aria-labelledby="title description">
  <title id="title">N Messenger</title>
  <desc id="description">Rounded neon-blue outlines intertwine an N and a paper plane. The background and the spaces within the mark are transparent.</desc>
  <defs>
    <linearGradient id="blue" x1="326" y1="704" x2="667" y2="328" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1C55E8"/>
      <stop offset=".5" stop-color="#2D6BFF"/>
      <stop offset="1" stop-color="#3C82FF"/>
    </linearGradient>
    <linearGradient id="light" x1="330" y1="701" x2="671" y2="327" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4C8AFF"/>
      <stop offset=".55" stop-color="#6FA2FF"/>
      <stop offset="1" stop-color="#5E96FF"/>
    </linearGradient>
    <g id="mark" stroke-linecap="round" stroke-linejoin="round">
      <!-- Continuous outside edge: the N returns through the paper plane. -->
      <path d="M508 400L702 331C721 324 734 334 729 355L655 684C651 705 633 716 614 703L571 675C568 673 566 671 564 668L441 474C436 466 434 466 434 477V690C434 696 431 699 425 699H386C369 699 356 687 356 670V349C356 332 369 320 386 320H412C423 320 429 323 435 332L586 557C591 565 594 567 596 555L606 492"/>
      <!-- Left wing disappears behind the vertical stem of the N. -->
      <path d="M337 465L275 488C253 496 253 513 275 521L337 542"/>
      <!-- Upper fold: rounded nose and a soft return into the diagonal. -->
      <path d="M530 466L645 398C654 393 656 396 649 404L566 491"/>
      <!-- Lower folds share rounded junctions with the letter. -->
      <path d="M495 558L461 592C459 594 458 596 457 600L435 695C434 699 438 700 442 696L505 633"/>
      <path d="M460 596L569 674"/>
    </g>
  </defs>

  <!-- Low-opacity vector strokes provide a soft halo without a bitmap or background. -->
  <use href="#mark" stroke="#2F5BFF" stroke-width="40" opacity=".018"/>
  <use href="#mark" stroke="#2F5BFF" stroke-width="32" opacity=".025"/>
  <use href="#mark" stroke="#2F5BFF" stroke-width="25" opacity=".045"/>
  <use href="#mark" stroke="#2F5BFF" stroke-width="19" opacity=".08"/>
  <use href="#mark" stroke="#3462FF" stroke-width="14" opacity=".17"/>
  <use href="#mark" stroke="url(#blue)" stroke-width="10"/>
  <use href="#mark" stroke="url(#light)" stroke-width="4.5"/>
</svg>
