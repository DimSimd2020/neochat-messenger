[package]
name = "neocore"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "NeoChat client core: E2EE (libsignal), encrypted local store, sync and outbox"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.105.1" }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
ed25519-dalek = "2"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
zeroize = "1"
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["executor"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
qrcode = { version = "0.14", default-features = false }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
hkdf = "0.12"

[target.'cfg(target_vendor = "apple")'.dependencies]
rusqlite = { version = "0.37", features = ["bundled-sqlcipher"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "unwind"
