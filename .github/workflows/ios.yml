name: iOS

on:
  push:
    tags: ["v*"]
    branches: ["main"]
    paths: ["core/**", "apps/ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run host tests and the iOS simulator UI suite"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# A newer push supersedes the running build instead of queueing behind it.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: brew install protobuf xcodegen

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ios-core-${{ runner.arch }}-${{ hashFiles('core/Cargo.lock') }}

      - name: Core (aarch64-apple-ios)
        working-directory: core
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: cargo build --release --lib --target aarch64-apple-ios

      - name: Core tests (host)
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests
        working-directory: core
        run: cargo test --lib

      - name: Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild -project NeoChat.xcodeproj -scheme NeoChat -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 200

      - name: Package IPA
        working-directory: apps/ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NeoChat.app Payload/
          # The core must be linked statically into the app binary.
          if otool -L Payload/NeoChat.app/NeoChat | grep -q neocore; then echo "core linked dynamically"; exit 1; fi
          nm -gU Payload/NeoChat.app/NeoChat >/dev/null 2>&1 || true
          ls -la Payload/NeoChat.app/NeoChat
          zip -qry NeoChat-unsigned.ipa Payload
          ls -la NeoChat-unsigned.ipa

      - name: Upload IPA to release
        if: github.event_name != 'workflow_dispatch' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then TAG="${GITHUB_REF_NAME}"
          else
            VER=$(sed -n 's/.*MARKETING_VERSION: "\([^"]*\)".*/\1/p' apps/ios/project.yml | head -n1)
            TAG="v${VER}"
          fi
          IPA="NeoChat-${TAG#v}-ios-unsigned.ipa"
          cp apps/ios/NeoChat-unsigned.ipa "$IPA"
          gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "NeoChat ${TAG#v}" --notes "NeoChat ${TAG#v}" --target "$GITHUB_SHA" --latest --repo "${GITHUB_REPOSITORY}"
          ok=0
          for i in 1 2 3 4 5 6; do
            if gh release upload "$TAG" "$IPA" --clobber --repo "${GITHUB_REPOSITORY}"; then ok=1; break; fi
            sleep $((i * 5))
          done
          test "$ok" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: NeoChat-unsigned-ipa
          path: apps/ios/NeoChat-unsigned.ipa
          retention-days: 30

  # Runs the app with a local API and a test-only mailbox on an iOS Simulator.
  # Manual and opt-in: it needs a second macOS runner.
  simulator:
    if: github.event_name == 'workflow_dispatch' && inputs.run_tests
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: brew install protobuf xcodegen postgresql@17

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios-sim

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ios-sim-core-${{ hashFiles('core/Cargo.lock') }}

      - name: Core (aarch64-apple-ios-sim)
        working-directory: core
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: cargo build --release --lib --target aarch64-apple-ios-sim

      - name: Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: UI test on simulator
        working-directory: apps/ios
        env:
          TEST_RUNNER_SHOTS_DIR: ${{ github.workspace }}/ios-shots
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone 1[0-9][^(]*\(([0-9A-F-]{36})\)' | grep -oE '[0-9A-F-]{36}')
          echo "simulator $DEVICE"
          # A local API and test-only mailbox keep real verification and E2EE flows,
          # without sending emails or registering accounts on the production server.
          export PATH="$(brew --prefix postgresql@17)/bin:$PATH"
          TASK_PGDIR="$RUNNER_TEMP/neochat-email-pg"
          initdb -D "$TASK_PGDIR" -A trust -U postgres >/dev/null
          pg_ctl -D "$TASK_PGDIR" -l "$RUNNER_TEMP/neochat-email-pg.log" -o '-h 127.0.0.1 -p 55432' start
          trap 'pg_ctl -D "$TASK_PGDIR" stop -m fast' EXIT
          createdb -h 127.0.0.1 -p 55432 -U postgres neochat_ios_email_test
          export NEOCHAT_TEST_DATABASE_URL='postgres://postgres@127.0.0.1:55432/neochat_ios_email_test?sslmode=disable'
          export NEOCHAT_NATIVE_TEST_COMMAND
          NEOCHAT_NATIVE_TEST_COMMAND=$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1:]))' \
            xcodebuild -project "$GITHUB_WORKSPACE/apps/ios/NeoChat.xcodeproj" -scheme NeoChat -configuration Debug \
            -destination "id=$DEVICE" -derivedDataPath "$GITHUB_WORKSPACE/apps/ios/build-sim" -resultBundlePath "$GITHUB_WORKSPACE/apps/ios/UITests.xcresult" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO test)
          cd ../../server
          go test ./internal/app -run '^TestNativeEmailFlow$' -count=1 -timeout=50m -v | tail -n 150

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-shots
          path: ios-shots
          retention-days: 14
