name: Release packages

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub release tag to upload to"
        required: true
        default: "v0.6.5-preview"

permissions:
  contents: write

concurrency:
  group: release-packages-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Release tag
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then TAG="$INPUT_TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then TAG="${GITHUB_REF_NAME}"
          else
            VER=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' apps/android/app/build.gradle.kts | head -n1)
            TAG="v${VER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "uploading to $TAG"
          gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "NeoChat ${TAG#v}" --notes "NeoChat ${TAG#v}" --target "$GITHUB_SHA" --latest --repo "${GITHUB_REPOSITORY}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -n1)
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "platforms;android-35" "build-tools;35.0.0"

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler perl

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: android-core-noasm-${{ hashFiles('core/Cargo.lock') }}

      - name: Core (Android)
        working-directory: core
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          OPENSSL_NO_ASM: "1"
        run: cargo ndk -t arm64-v8a --platform 26 -o ../apps/android/app/src/main/jniLibs build --release --lib

      - name: APK
        working-directory: apps/android
        run: chmod +x ./gradlew && ./gradlew assembleRelease --no-daemon

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          APK="Neochat-${TAG}.apk"
          cp apps/android/app/build/outputs/apk/release/app-release.apk "$APK"
          ls -la "$APK"
          ok=0
          for i in 1 2 3 4 5 6; do
            if gh release upload "$TAG" "$APK" --clobber --repo "${{ github.repository }}"; then ok=1; break; fi
            sleep $((i * 5))
          done
          test "$ok" -eq 1

  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Release tag
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then TAG="$INPUT_TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then TAG="${GITHUB_REF_NAME}"
          else
            VER=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' apps/android/app/build.gradle.kts | head -n1)
            TAG="v${VER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "uploading to $TAG"
          gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "NeoChat ${TAG#v}" --notes "NeoChat ${TAG#v}" --target "$GITHUB_SHA" --latest --repo "${GITHUB_REPOSITORY}"

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Rust
        run: rustup toolchain install stable --profile minimal

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: windows-core-${{ hashFiles('core/Cargo.lock') }}

      - name: Perl and Ninja
        run: choco install strawberryperl ninja -y --no-progress

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          archives: qtbase qtsvg qttools qttranslations icu

      - name: Core (Windows)
        working-directory: core
        shell: cmd
        run: |
          set PATH=C:\Strawberry\perl\bin;%PATH%
          set PERL=C:\Strawberry\perl\bin\perl.exe
          cargo build --release --lib

      # Prebuilt libwebrtc for calls (crow-misia/libwebrtc-bin, BSD-3-Clause), pinned by hash.
      - name: libwebrtc
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/crow-misia/libwebrtc-bin/releases/download/152.7977.0.0/libwebrtc-win-x64.7z"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\libwebrtc.7z"
          $hash = (Get-FileHash "$env:RUNNER_TEMP\libwebrtc.7z" -Algorithm SHA256).Hash
          if ($hash -ne "41E64B712F3777DB0377E8445972051366BC333905B0880A1FC6C4BEF1F5B8CF") { throw "libwebrtc checksum mismatch: $hash" }
          7z x -y -bd "-o$env:RUNNER_TEMP\webrtc" "$env:RUNNER_TEMP\libwebrtc.7z" | Out-Null
          "WEBRTC_DIR=$($env:RUNNER_TEMP -replace '\\','/')/webrtc" >> $env:GITHUB_ENV

      - name: Desktop
        shell: cmd
        run: |
          cmake -S apps\desktop -B apps\desktop\build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWEBRTC_DIR=%WEBRTC_DIR%
          cmake --build apps\desktop\build

      - name: WiX
        shell: cmd
        run: |
          dotnet tool install --global wix --version 6.0.1
          wix extension add -g WixToolset.UI.wixext/6.0.1
          wix extension add -g WixToolset.Util.wixext/6.0.1

      - name: MSI
        shell: pwsh
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $ver = ($env:TAG.TrimStart("v") -split "-")[0]
          $stage = "apps\desktop\build\stage"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage | Out-Null
          $exe = "apps\desktop\build\neochat.exe"
          if (-not (Test-Path $exe)) { $exe = "apps\desktop\build\Release\neochat.exe" }
          Copy-Item $exe "$stage\neochat.exe"
          Copy-Item (Join-Path (Split-Path $exe) "neocall.dll") "$stage\neocall.dll"
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw --no-compiler-runtime "$stage\neochat.exe"
          $crt = $null
          if ($env:VCToolsRedistDir) {
            $crt = Get-ChildItem "$env:VCToolsRedistDir\x64\Microsoft.VC*.CRT\*.dll" -ErrorAction SilentlyContinue
          }
          if (-not $crt) {
            $crt = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT\*.dll"
          }
          if (-not $crt) { throw "VC CRT DLLs not found" }
          $crt | Copy-Item -Destination $stage
          if (Test-Path LICENSE) { Copy-Item LICENSE "$stage\LICENSE.txt" }
          $stageAbs = (Resolve-Path $stage).Path
          $msi = "apps\desktop\build\NeoChat-$ver-x64.msi"
          wix build -wx -arch x64 -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext -culture ru-RU -d Version=$ver -d StageDir="$stageAbs" apps\desktop\packaging\neochat.wxs -b apps\desktop\packaging -o $msi
          $out = "Neochat-$($env:TAG)-setup.msi"
          Copy-Item $msi $out
          Get-Item $out | Format-List Name, Length, FullName

      - name: Upload MSI to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          $out = "Neochat-$env:TAG-setup.msi"
          $ok = $false
          foreach ($i in 1..6) {
            gh release upload "$env:TAG" $out --clobber --repo ${{ github.repository }}
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Start-Sleep -Seconds (5 * $i)
          }
          if (-not $ok) { throw "release upload failed" }
