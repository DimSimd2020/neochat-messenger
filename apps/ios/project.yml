name: NeoChat
options:
  bundleIdPrefix: app.neochat
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO
targets:
  NeoChat:
    type: application
    platform: iOS
    sources:
      - path: NeoChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.neochat
        INFOPLIST_FILE: NeoChat/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: NeoChat/NeoChat-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../../core/include
        # Link the static core explicitly: the same folder also holds a dylib.
        OTHER_LDFLAGS: $(SRCROOT)/../../core/target/aarch64-apple-ios/release/libneocore.a
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    dependencies:
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: QuickLook.framework
      - sdk: BackgroundTasks.framework
      - sdk: UserNotifications.framework
      - sdk: AVFoundation.framework
