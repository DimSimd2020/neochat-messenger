# coturn for NeoChat calls. deploy.sh installs it as /etc/turnserver.conf and
# appends static-auth-secret from /etc/neochat/turn.env (generated on the host,
# never in the repository). The server hands out short-lived credentials
# (TURN REST API, HMAC-SHA1) at GET /v1/calls/ice.
listening-port=3478
realm=r1270286.s2566.vm.mydomain.zone
use-auth-secret
fingerprint
min-port=49160
max-port=49200
# Plain TURN only: media inside is already DTLS-SRTP encrypted end to end.
no-tls
no-dtls
no-tcp-relay
no-cli
no-multicast-peers
user-quota=12
total-quota=120
stale-nonce=600
syslog
simple-log
# No relaying into private or special networks.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
