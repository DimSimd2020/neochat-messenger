# NeoChat API on its own port; the existing site on 80/443 is not touched.
# Uses the host's existing certificate for the same domain.
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name r1270286.s2566.vm.mydomain.zone;

    ssl_certificate     /etc/nginx/ssl/freeg.crt;
    ssl_certificate_key /etc/nginx/ssl/freeg.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Attachments are at most 26 MiB of ciphertext; stream them without buffering.
    client_max_body_size 27m;
    proxy_request_buffering off;
    proxy_buffering off;

    # No request URLs in logs: tokens are never in URLs, but keep logs minimal anyway.
    access_log off;

    location = /v1/events {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # The password-sealed history copy may be up to 200 MiB.
    location = /v1/accounts/current/history {
        client_max_body_size 201m;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
}
